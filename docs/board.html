<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Octarine Whiteboard</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a1e;
    }
  </style>
  <script src="octarine/octarine.bundle.js"></script>
</head>
<body>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const bgTheme = params.get('theme') || undefined;

      Octarine.init({
        board: { standalone: true, background: bgTheme },
        panel: false,
        trigger: false,
        camera: false,
        voice: false,
        hint: false
      });
    });
  </script>
</body>
</html>
