<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Octarine — Classroom Presentation Layer</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f1117;
      color: #eee;
    }
    #frame-content {
      width: 100vw;
      height: 100vh;
      border: none;
      display: block;
    }
  </style>
  <script src="octarine/octarine.bundle.js"></script>
</head>
<body>

  <iframe id="frame-content" src="frame.html"></iframe>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Octarine.init({
        trigger: 'top-left',
        hint: true
      });
    });
  </script>
</body>
</html>
